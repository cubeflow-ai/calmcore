# Calm 配置文件

host = "127.0.0.1"
user = "root"
password = "calm"

# GraphQL 服务端口
graphql_port = 9567

# Elasticsearch 服务端口
es_port = 9200

# MySQL 服务端口
mysql_port = 3307

# 日志配置
[log]
level = "debug"          # 日志级别: trace, debug, info, warn, error
target = "file"          # 输出目标: console, file, both
file = "./logs/calm.log" # 日志文件路径
rotation = true          # 启用日志轮转
max_size_mb = 100        # 单个日志文件最大大小(MB)
max_files = 10           # 保留的日志文件数量

# 引擎配置
[engine]
data_dir = "./data"              # 数据目录
persist_check_interval_secs = 60 # 持久化检查间隔(秒)
max_concurrent_persists = 4      # 最大并发持久化数
check_after_flush = true         # flush后立即检查持久化
