syntax = "proto3";

package distributed_query;

// 分布式查询服务
service DistributedQueryService {
    // 执行查询，返回流式结果
    rpc ExecuteQuery(QueryRequest) returns (stream QueryResultChunk);
    
    // 发送 Shuffle 数据
    rpc SendShuffle(stream ShuffleChunk) returns (ShuffleAck);
    
    // 取消查询
    rpc CancelQuery(CancelRequest) returns (CancelResponse);
    
    // 健康检查
    rpc HealthCheck(HealthRequest) returns (HealthResponse);
}

// 查询请求
message QueryRequest {
    // SQL 查询语句
    string sql = 1;
    // 查询 ID
    string query_id = 2;
    // 超时时间（毫秒）
    uint64 timeout_ms = 3;
    // 只查询指定的 partition
    repeated string partition_filter = 4;
}

// 查询结果块（Arrow IPC 格式）
message QueryResultChunk {
    // 查询 ID
    string query_id = 1;
    // 块索引
    uint64 chunk_index = 2;
    // Arrow IPC 格式的数据
    bytes data = 3;
    // 是否为最后一块
    bool is_last = 4;
    // 错误信息（如果有）
    string error = 5;
}

// Shuffle 数据块
message ShuffleChunk {
    // 查询 ID
    string query_id = 1;
    // 源节点 ID
    string source_node = 2;
    // 目标节点 ID  
    string target_node = 3;
    // 块索引
    uint64 chunk_index = 4;
    // Arrow IPC 格式的数据
    bytes data = 5;
    // 是否为 EOF
    bool is_eof = 6;
}

// Shuffle 确认
message ShuffleAck {
    // 是否成功
    bool success = 1;
    // 接收的块数量
    uint64 chunks_received = 2;
    // 错误信息
    string error = 3;
}

// 取消请求
message CancelRequest {
    string query_id = 1;
}

// 取消响应
message CancelResponse {
    bool success = 1;
    string message = 2;
}

// 健康检查请求
message HealthRequest {
    string node_id = 1;
}

// 健康检查响应
message HealthResponse {
    bool healthy = 1;
    string node_id = 2;
    uint64 active_queries = 3;
}
