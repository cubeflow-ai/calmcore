[package]
name = "calm"
version = "0.1.0"
edition = "2021"

[dependencies]
futures = "0.3"
log = "0.4.16"
roaring = "0.11.2"
# arrow = "54.3.1"
rand = "0.9.2"
thiserror = "2.0.17"
itertools = "0.14.0"
rayon = "1.11"
# parquet = "54.3.1"
datafusion = "50.3.0"
async-trait = "0.1"
bytes = "1.9"
