[workspace]
members = [".", "crates/ddl_macros"]

[package]
name = "calm"
version = "0.1.0"
edition = "2021"
default-run = "calm"

[dependencies]
ddl_macros = { path = "crates/ddl_macros" }
version_macro = "0.1.0"
futures = "0.3"
log = "0.4.16"
env_logger = "0.11"
roaring = "0.11.2"
# arrow = "54.3.1"
rand = "0.9.2"
thiserror = "2.0.17"
itertools = "0.14.0"
rayon = "1.11"
sha1 = "0.10"
# parquet = "54.3.1"
datafusion = "51.0.0" # 升级以支持 datafusion-distributed
datafusion-distributed = { git = "https://github.com/datafusion-contrib/datafusion-distributed.git", branch = "main" }
datafusion-proto = "51.0.0" # 用于 PhysicalExtensionCodec
async-trait = "0.1"
bytes = "1.9"
serde_json = "1.0.114"
ahash = "0.8"
byteorder = "1.5"
zstd = "0.13"
ordered-float = "5.1.0"
mem_btree = { path = "libs/mem_btree" }
uuid = { version = "1.11", features = ["v4"] }
bloomfilter = "3.0.1"
memmap2 = "0.9"
serde = { version = "1.0", features = ["derive"] }
chitchat = "0.9"
tokio = { version = "1", features = [
    "rt-multi-thread",
    "sync",
    "time",
    "macros",
    "net",
] }
msql-srv = { path = "libs/msql-srv-patched" } # Patched 版本 - 支持 CLIENT_SECURE_CONNECTION

# Web framework - Poem
poem = { version = "3", features = ["embed"] }
poem-openapi = "5"

unicode-segmentation = "1.11.0"

# RPC - tarpc for internal cluster communication
tarpc = { version = "0.37", features = ["tokio1", "serde-transport", "tcp"] }
tokio-serde = { version = "0.9", features = ["bincode"] }

# GraphQL
async-graphql = "7"
async-graphql-poem = "7"

# gRPC for distributed query
poem-grpc = "0.4"

# Arrow Flight for datafusion-distributed
tonic = "0.14"
arrow-flight = "57"
prost = "0.13"

regex = "1.10"
chrono = "0.4"
toml = "0.8"
base64 = "0.22"
reqwest = { version = "0.12", features = ["json", "stream"] }
url = "2.5"                                                   # for datafusion-distributed
sysinfo = "0.33"                                              # for system metrics

[dev-dependencies]
tempfile = "3.23.0"

[[bin]]
name = "calm"
path = "src/bin/calm/main.rs"
