[package]
name = "calm"
version = "0.1.0"
edition = "2021"

[dependencies]
version_macro = "0.1.0"
futures = "0.3"
log = "0.4.16"
env_logger = "0.11"
roaring = "0.11.2"
# arrow = "54.3.1"
rand = "0.9.2"
thiserror = "2.0.17"
itertools = "0.14.0"
rayon = "1.11"
# parquet = "54.3.1"
datafusion = "50.3.0"
async-trait = "0.1"
bytes = "1.9"
serde_json = "1.0.114"
ahash = "0.8"
byteorder = "1.5"
zstd = "0.13"
ordered-float = "5.1.0"
mem_btree = { path = "libs/mem_btree" }
uuid = { version = "1.11", features = ["v4"] }
bloomfilter = "3.0.1"
memmap2 = "0.9"
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1", features = [
    "rt-multi-thread",
    "sync",
    "time",
    "macros",
    "net",
] }
msql-srv = "0.11"

# Web framework - Poem
poem = { version = "3", features = ["embed"] }
poem-openapi = "5"

# GraphQL
async-graphql = "7"
async-graphql-poem = "7"
regex = "1.10"
chrono = "0.4"
toml = "0.8"

[dev-dependencies]
tempfile = "3.23.0"

[[bin]]
name = "calm"
path = "src/bin/calm/main.rs"
